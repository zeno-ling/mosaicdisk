name: Build macOS x64

on:
  workflow_dispatch:

jobs:
  build-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build release (cross-compile to x86_64)
        run: cargo build --release --no-default-features --target x86_64-apple-darwin

      - name: Package tar.gz
        run: bash scripts/release.sh -s -n -t x86_64-apple-darwin -a x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: target/MosaicDisk-*-macos-x64.tar.gz

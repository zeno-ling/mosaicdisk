name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build on all three platforms. Uses the same flags as the release scripts:
  # --no-default-features skips mimalloc (its C build breaks on some gcc setups).
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --no-default-features

  # Run the unit-test suite on Linux. The Windows box used during development
  # had a locked %TEMP% plus path-separator-dependent assertions, so tests are
  # exercised on the clean Linux runner where the full suite is green.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --release --no-default-features --bin mosaicdisk
